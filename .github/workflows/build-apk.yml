name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Synchronize complete v2.3.45 source to main
        if: hashFiles('.github/source-sync/payload-*.b64') != ''
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, zipfile
          root = pathlib.Path.cwd()
          parts = sorted((root / '.github' / 'source-sync').glob('payload-*.b64'))
          if not parts:
              raise RuntimeError('Missing source payload')
          data = base64.b64decode(''.join(p.read_text(encoding='ascii') for p in parts), validate=True)
          with zipfile.ZipFile(io.BytesIO(data)) as source:
              for entry in source.infolist():
                  name = pathlib.PurePosixPath(entry.filename)
                  if name.is_absolute() or '..' in name.parts:
                      raise ValueError('Unsafe source path: ' + entry.filename)
                  if entry.filename in ('android_development/debug.keystore', '.github/workflows/build-apk.yml'):
                      raise ValueError('Unexpected excluded source path: ' + entry.filename)
              source.extractall(root)
          for part in parts:
              part.unlink()
          (root / '.github' / 'source-sync').rmdir()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize complete v2.3.45 source project"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate disposable debug signing key
        run: |
          mkdir -p android_development
          keytool -genkeypair -v -keystore android_development/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Canadian Amateur Radio Study Guide,C=CA'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Canadian-Amateur-Radio-Study-Guide-v2.3.45-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
